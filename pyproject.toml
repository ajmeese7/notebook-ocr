[project]
name = "notebook-ocr"
version = "0.1.0"
description = "Transcribe handwritten notebook photos to markdown with the Claude API."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { file = "LICENSE" }
dependencies = [
    "anthropic>=0.69",
    "opencv-python>=4.9",
    "numpy>=1.26",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "pillow>=10.2",
    "pillow-heif>=0.16",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
notebook-ocr = "notebook_ocr.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notebook_ocr"]

[dependency-groups]
dev = [
    "httpx2>=2.9",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast, isolated test with no network or API access",
    "integration: exercises the live Claude API (requires credentials)",
]

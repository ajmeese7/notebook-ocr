# Copy to config.yaml and edit. config.yaml is gitignored (may hold local absolute paths).
# The API key is NOT configured here — it resolves from ANTHROPIC_API_KEY or an
# `ant auth login` profile in the environment.

input_dir: ./photos           # one folder = one notebook; output is <folder-name>.md
vault_dir: ./vault            # where the .md file is written
model: claude-opus-5
# fallback_model: claude-sonnet-5  # optional; tried only when the primary refuses a page
max_tokens: 16000
state_file: ./state.json

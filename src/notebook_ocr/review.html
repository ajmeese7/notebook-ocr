<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>notebook-ocr review</title>
    <style>
      :root {
        --bg: #16161a;
        --panel: #1e1e24;
        --border: #32323c;
        --text: #e4e4ea;
        --muted: #8b8b98;
        --accent: #7aa2f7;
        --edited: #9ece6a;
        --failed: #f7768e;
        --dirty: #e0af68;
        /* Same amber as --dirty on purpose: both mean "needs attention", not "error". */
        --missing: #e0af68;
        --sidebar-width: 240px;
        --preview-height: 260px;
      }
      * { box-sizing: border-box; }
      /* Every track below is minmax(0, ...) on purpose: a bare `1fr` has a min-content
         floor, so a tall image or long transcription would push the page past 100vh and
         scroll the whole document instead of the pane it belongs to. */
      body {
        margin: 0;
        height: 100vh;
        display: grid;
        grid-template-columns: var(--sidebar-width) 5px minmax(0, 1fr);
        grid-template-rows: minmax(0, 1fr);
        background: var(--bg);
        color: var(--text);
        font: 14px/1.5 system-ui, sans-serif;
      }

      /* Page list */
      #sidebar { border-right: 1px solid var(--border); overflow-y: auto; min-height: 0; }
      #notebook-name {
        padding: 12px 14px;
        border-bottom: 1px solid var(--border);
        font-weight: 600;
        position: sticky;
        top: 0;
        background: var(--bg);
      }
      #notebook-name small { display: block; color: var(--muted); font-weight: 400; }
      /* An input, not a label, so renaming is one click with no edit-mode to discover.
         Borderless until focused: it should read as the heading it replaces. */
      #title {
        width: 100%;
        border: 1px solid transparent;
        border-radius: 4px;
        margin: -3px -5px 0;
        padding: 2px 4px;
        background: none;
        color: inherit;
        font: inherit;
      }
      #title:hover:not(:focus) { border-color: var(--border); }
      #title:focus { outline: none; border-color: var(--accent); background: var(--panel); }

      /* Drag to resize the sidebar; double-click to restore the default width. */
      #sidebar-resizer { cursor: col-resize; background: var(--border); }
      #sidebar-resizer:hover, body.resizing #sidebar-resizer { background: var(--accent); }
      /* A pointer capture drag would otherwise select page names as it swept across them. */
      body.resizing { user-select: none; }
      body.sidebar-collapsed { grid-template-columns: minmax(0, 1fr); }
      body.sidebar-collapsed #sidebar, body.sidebar-collapsed #sidebar-resizer { display: none; }
      .page-item {
        display: flex;
        gap: 8px;
        align-items: baseline;
        padding: 8px 14px;
        cursor: pointer;
        border-left: 3px solid transparent;
      }
      .page-item:hover { background: var(--panel); }
      .page-item.selected { background: var(--panel); border-left-color: var(--accent); }
      .page-item .num { color: var(--muted); font-variant-numeric: tabular-nums; }
      .page-item .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; align-self: center; }
      .dot.transcribed { background: var(--muted); }
      .dot.edited { background: var(--edited); }
      .dot.failed { background: var(--failed); }
      .dot.missing { background: var(--missing); }
      .dot.dirty { background: var(--dirty); }

      /* Side-by-side panes */
      /* The column is declared, not implicit: an implicit `auto` track sizes to the
         toolbar's max-content, so a long status message widens the whole pane instead of
         being truncated by it. */
      #main {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: auto minmax(0, 1fr);
        min-width: 0;
      }
      #toolbar {
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 10px 16px;
        border-bottom: 1px solid var(--border);
      }
      #toolbar .spacer { flex: 1; }
      /* Buttons keep their size; the two text runs give up width instead. Without this the
         toolbar is wider than the pane and the whole document scrolls sideways. */
      #toolbar button { flex: none; }
      #meta {
        color: var(--muted);
        font-size: 13px;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      /* Only the filename is coloured: the capture time and the note beside it are not
         the thing being flagged, and a whole red toolbar row reads as an alarm. */
      #meta .name.failed { color: var(--failed); }
      #meta .name.missing { color: var(--missing); }
      button {
        background: var(--panel);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 5px 12px;
        font: inherit;
        cursor: pointer;
        /* The toolbar is a flex row: without this a two-word label wraps mid-button as
           soon as the panes get narrow. */
        white-space: nowrap;
      }
      button:hover:not(:disabled) { border-color: var(--accent); }
      button:disabled { opacity: 0.4; cursor: default; }
      #save { border-color: var(--dirty); }
      #save:disabled { border-color: var(--border); }

      #panes {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        grid-template-rows: minmax(0, 1fr);
        min-height: 0;
      }
      #image-wrap {
        position: relative;
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: minmax(0, 1fr);
        min-width: 0;
        min-height: 0;
      }
      #image-pane {
        overflow: auto;
        min-height: 0;
        background: #0e0e11;
        display: flex;
        padding: 12px;
        /* A drag pans the page, so it must not sweep a text selection across the UI. */
        user-select: none;
      }
      /* Grab affordance only when there is somewhere to go; a fitted page cannot pan. */
      #image-pane.pannable #page-image { cursor: grab; }
      #image-pane.panning, #image-pane.panning #page-image { cursor: grabbing; }
      /* margin:auto, not justify/align-content: a centred flex item whose content
         overflows puts its top-left outside the scrollable area and makes it unreachable.
         Auto margins centre the same way and collapse to zero once it overflows. */
      #page-image { display: block; margin: auto; }
      /* Floated over the page rather than parked in the toolbar: it belongs to the pane it
         controls, and the toolbar is already the tightest row in the UI. Inset far enough
         to clear the scrollbars, which the scroller draws along the same two edges. */
      #zoom-controls {
        position: absolute;
        right: 18px;
        bottom: 18px;
        display: flex;
        gap: 4px;
        padding: 4px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: rgb(14 14 17 / 0.85);
        opacity: 0.75;
        transition: opacity 0.15s;
      }
      /* Quiet until wanted, but never invisible: the zoom level is worth reading at a
         glance, and a control you have to hunt for is not discoverable. */
      #zoom-controls:hover, #zoom-controls:focus-within { opacity: 1; }
      #zoom-controls button { padding: 3px 9px; }
      /* Fixed width and tabular figures: the percentage changes on every click, and a
         button that resizes under the cursor is a button you miss on the second press. */
      #zoom-level { min-width: 4.25rem; font-variant-numeric: tabular-nums; }
      #text-pane {
        display: grid;
        grid-template-rows: minmax(0, 1fr);
        border-left: 1px solid var(--border);
        min-width: 0;
        /* Anchors the transcribing overlay to this pane. */
        position: relative;
      }

      /* Shown over the text being replaced, not just as a word in the toolbar: a
         transcription runs for tens of seconds, and the pane is where the change lands. */
      #busy { display: none; }
      body.spending #busy {
        position: absolute;
        inset: 0;
        z-index: 1;
        display: flex;
        gap: 10px;
        align-items: center;
        justify-content: center;
        background: rgb(22 22 26 / 0.72);
        color: var(--muted);
      }
      body.spending #text { opacity: 0.4; }
      .spinner {
        width: 16px;
        height: 16px;
        border: 2px solid var(--border);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      /* Still turns, so it never reads as hung, just slowly enough not to be a distraction. */
      @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } }
      /* Drawings split off the bottom of the transcription rather than taking a column of
         their own: they belong to the text they sit in, and a third column would squeeze
         both the page image and the lines being corrected. */
      body.preview-open #text-pane {
        grid-template-rows: minmax(0, 1fr) 5px var(--preview-height);
      }
      #text {
        width: 100%;
        height: 100%;
        resize: none;
        border: 0;
        padding: 16px;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.7 ui-monospace, "SF Mono", Menlo, monospace;
        tab-size: 2;
      }
      #text:focus { outline: none; }
      /* Drawing previews */
      #preview-pane, #preview-resizer { display: none; }
      #preview-resizer { cursor: row-resize; background: var(--border); }
      #preview-resizer:hover, body.resizing #preview-resizer { background: var(--accent); }
      body.preview-open #preview-resizer { display: block; }
      body.preview-open #preview-pane {
        display: flex;
        flex-wrap: wrap;
        align-content: flex-start;
        gap: 12px;
        overflow-y: auto;
        min-height: 0;
        padding: 12px;
      }
      .drawing {
        width: 15rem;
        margin: 0;
        border: 1px solid var(--border);
        border-radius: 6px;
        overflow: hidden;
        cursor: pointer;
      }
      .drawing:hover { border-color: var(--accent); }
      /* The prompt asks for black strokes on a transparent background, so a drawing is
         invisible on this theme without a light card behind it. */
      .drawing img {
        display: block;
        width: 100%;
        height: auto;
        /* A tall diagram would otherwise fill the pane and hide the ones after it. */
        max-height: 12rem;
        object-fit: contain;
        background: #fff;
        padding: 8px;
      }
      .drawing figcaption { padding: 6px 8px; color: var(--muted); font-size: 12px; }
      .drawing.broken figcaption { color: var(--failed); }
      #preview-empty { color: var(--muted); font-size: 13px; }
      /* Bounded because an API error detail can be a paragraph, and letting it wrap grows
         the toolbar and shoves the panes down. The full text stays in the title tooltip. */
      #status {
        color: var(--muted);
        font-size: 13px;
        flex: 0 1 auto;
        min-width: 0;
        max-width: 22rem;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #status.dirty { color: var(--dirty); }
      #status.error { color: var(--failed); }

      /* Spend confirmation. Every other action here is local and reversible; this one
         bills an API key, so it gets a modal rather than the button doing it outright. */
      #confirm {
        width: min(30rem, calc(100vw - 32px));
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 20px;
        background: var(--panel);
        color: var(--text);
        font: inherit;
      }
      #confirm::backdrop { background: rgb(0 0 0 / 0.6); }
      #confirm h2 { margin: 0 0 10px; font-size: 16px; }
      #confirm p { margin: 0 0 10px; color: var(--muted); }
      #confirm p.warn { color: var(--dirty); }
      #confirm .cost { color: var(--text); }
      #confirm .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
      /* The spending button is the one that has to look deliberate, so it carries the
         colour; cancel stays the plain default and holds the initial focus. */
      #confirm-ok { border-color: var(--dirty); }
    </style>
  </head>
  <body>
    <aside id="sidebar">
      <div id="notebook-name">
        <input id="title" spellcheck="false" title="Rename this notebook (display only)" />
        <small id="page-count"></small>
      </div>
      <div id="page-list"></div>
    </aside>
    <div id="sidebar-resizer" role="separator" aria-orientation="vertical"
         title="Drag to resize, double-click to reset"></div>

    <section id="main">
      <div id="toolbar">
        <button id="toggle-sidebar" title="Show/hide the page list ([)">☰</button>
        <button id="prev" title="Previous page (k / ←)">←</button>
        <button id="next" title="Next page (j / →)">→</button>
        <span id="meta"></span>
        <span class="spacer"></span>
        <span id="status"></span>
        <button id="toggle-preview" title="Show/hide rendered drawings (p)">Drawings</button>
        <button id="retranscribe" title="Send this page to the model again (costs money)">Re-transcribe</button>
        <button id="revert" title="Discard unsaved edits">Revert</button>
        <button id="save" title="Save correction (ctrl-s)">Save</button>
      </div>
      <div id="panes">
        <!-- The controls are a sibling of the scroller, not a child: inside it they would
             scroll away with the page instead of staying put over it. -->
        <div id="image-wrap">
          <!-- draggable=false so the browser's native image drag does not pre-empt panning. -->
          <div id="image-pane"><img id="page-image" alt="" draggable="false" /></div>
          <div id="zoom-controls">
            <button id="zoom-out" title="Zoom out (-)">−</button>
            <button id="zoom-level" title="Fit the page to the pane (0)"></button>
            <button id="zoom-in" title="Zoom in (+)">+</button>
          </div>
        </div>
        <div id="text-pane">
          <textarea id="text" spellcheck="false" placeholder="No transcription for this page."></textarea>
          <div id="busy" role="status"><span class="spinner"></span><span id="busy-label"></span></div>
          <div id="preview-resizer" role="separator" aria-orientation="horizontal"
               title="Drag to resize, double-click to reset"></div>
          <div id="preview-pane"></div>
        </div>
      </div>
    </section>

    <dialog id="confirm" aria-labelledby="confirm-title">
      <h2 id="confirm-title"></h2>
      <div id="confirm-body"></div>
      <div class="actions">
        <button id="confirm-cancel" autofocus>Cancel</button>
        <button id="confirm-ok"></button>
      </div>
    </dialog>

    <script>
      const el = (id) => document.getElementById(id);
      // Draggable pane sizes: default, and the bounds a drag is clamped to.
      const SIDEBAR = { name: "sidebarWidth", css: "--sidebar-width", value: 240, min: 160, max: 520 };
      const PREVIEW = { name: "previewHeight", css: "--preview-height", value: 260, min: 120, max: 700 };
      // Re-rendering previews on every keystroke would flicker the images while typing.
      const PREVIEW_DEBOUNCE_MS = 200;
      // Zoom is a scale against the image's natural size. The step is geometric so each
      // press moves the same proportion whether you are at 20% or 400%.
      const ZOOM_STEP = 1.25;
      const ZOOM_MIN = 0.05;
      const ZOOM_MAX = 8;
      // A drag under this many pixels is a click, not a pan: fingers and mice both wobble.
      const PAN_SLOP_PX = 4;
      // Either an inline drawing or the comment the model leaves when it declines to
      // vectorize one; the capture group is the description, and is absent for an <svg>.
      const DRAWING_PATTERN = /<svg\b[\s\S]*?<\/svg>|<!--\s*drawing:\s*([\s\S]*?)-->/gi;

      // `saved` is the last known server text; the textarea diverging from it means dirty.
      let pages = [];
      // -1 until the first page is selected, so the initial select(0) is not mistaken for
      // a redundant re-click of the already-current page.
      let index = -1;
      let saved = "";
      // Last title the server acknowledged, so a failed or cancelled rename can revert.
      let savedTitle = "";
      let previewTimer = 0;
      // Model a re-transcribe would bill, named in the confirmation.
      let model = "";
      // The page a billable request is in flight for, or null. Non-null blocks a second
      // click from double-spending; the index is what the overlay keys off, so browsing to
      // another page during a long call does not drape it over the wrong transcription.
      let spending = null;
      let spendingTimer = 0;
      // Current image scale, and whether it is still the fitted one. `atFit` is tracked
      // rather than compared against a recomputed fit scale so the page re-fits when the
      // pane resizes, but stays put once you have chosen a zoom of your own.
      let zoom = 1;
      let atFit = true;
      // Pointer origin and starting scroll offsets while panning, or null.
      let panning = null;

      const current = () => pages[index];
      const isDirty = () => current() && el("text").value !== saved;

      async function load() {
        const res = await fetch("/api/notebook");
        if (!res.ok) return setStatus("failed to load notebook", "error");
        applyNotebook(await res.json());
        renderList();
        if (pages.length) select(0);
      }

      function applyNotebook(data) {
        pages = data.pages;
        model = data.model;
        savedTitle = data.title;
        el("title").value = data.title;
        el("title").placeholder = data.notebook;
        el("page-count").textContent = `${pages.length} page(s)`;
      }

      function renderList() {
        el("page-list").replaceChildren(
          ...pages.map((page, i) => {
            const item = document.createElement("div");
            item.className = "page-item" + (i === index ? " selected" : "");
            item.innerHTML =
              `<span class="dot ${page.status}"></span>` +
              `<span class="num">${String(page.page_number).padStart(3, "0")}</span>` +
              `<span class="name">${escapeHtml(page.filename)}</span>`;
            item.onclick = () => select(i);
            return item;
          })
        );
      }

      function select(next) {
        if (next === index) return;
        if (isDirty() && !confirm("Discard unsaved edits to this page?")) return;
        index = next;
        const page = current();
        saved = page.text;
        el("text").value = page.text;
        el("page-image").src = `/api/pages/${page.sha256}/image`;
        renderMeta();
        renderList();
        renderPreview();
        refresh();
      }

      function renderMeta() {
        const page = current();
        const note =
          page.status === "edited" ? " · edited" :
          page.status === "failed" ? ` · ${page.failure ?? "failed"}` :
          page.status === "missing" ? " · not transcribed" : "";
        const name = document.createElement("span");
        name.className = `name ${page.status}`;
        name.textContent = page.filename;
        el("meta").replaceChildren(name, ` · ${page.capture_time}${note}`);
        // Truncated when the toolbar is tight, so keep the whole line reachable.
        el("meta").title = el("meta").textContent;
      }

      function refresh() {
        const dirty = isDirty();
        el("save").disabled = !dirty || !el("text").value.trim();
        el("revert").disabled = !dirty;
        el("retranscribe").disabled = !current() || Boolean(spending);
        renderBusy();
        el("prev").disabled = index === 0;
        el("next").disabled = index >= pages.length - 1;
        setStatus(dirty ? "unsaved" : "", dirty ? "dirty" : "");
        // Mirror dirtiness onto the list dot so it is visible while scrolling elsewhere.
        const dot = el("page-list").children[index]?.firstChild;
        if (dot) dot.className = `dot ${dirty ? "dirty" : current().status}`;
      }

      // The overlay belongs to one page, so it shows only while that page is on screen.
      // The elapsed count is there because a bare spinner sitting still for forty seconds
      // is indistinguishable from a hung one.
      function renderBusy() {
        const active = spending !== null && spending.index === index;
        document.body.classList.toggle("spending", active);
        // Typing into text that is about to be overwritten is wasted work.
        el("text").readOnly = active;
        if (!active) return;
        const seconds = Math.round((performance.now() - spending.started) / 1000);
        el("busy-label").textContent =
          `Transcribing page ${spending.pageNumber}… ${seconds}s`;
      }

      // The scale at which the whole page is visible, from the pane's content box.
      function fitZoom() {
        const image = el("page-image");
        const pane = el("image-pane");
        if (!image.naturalWidth || !image.naturalHeight) return 1;
        const style = getComputedStyle(pane);
        const width =
          pane.clientWidth - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight);
        const height =
          pane.clientHeight - parseFloat(style.paddingTop) - parseFloat(style.paddingBottom);
        return Math.min(width / image.naturalWidth, height / image.naturalHeight);
      }

      function applyZoom() {
        const image = el("page-image");
        const pane = el("image-pane");
        image.style.width = `${image.naturalWidth * zoom}px`;
        image.style.height = `${image.naturalHeight * zoom}px`;
        el("zoom-level").textContent = `${Math.round(zoom * 100)}%`;
        el("zoom-in").disabled = zoom >= ZOOM_MAX;
        el("zoom-out").disabled = zoom <= ZOOM_MIN;
        // Only offer the grab cursor when there is actually somewhere to pan to.
        pane.classList.toggle(
          "pannable",
          pane.scrollWidth > pane.clientWidth || pane.scrollHeight > pane.clientHeight
        );
      }

      function fitImage() {
        zoom = fitZoom();
        atFit = true;
        applyZoom();
      }

      // Zooms about the centre of the pane, so the detail you are looking at stays put
      // instead of sliding away as the image grows around its top-left corner.
      function zoomBy(factor) {
        const pane = el("image-pane");
        const previous = zoom;
        zoom = Math.min(Math.max(zoom * factor, ZOOM_MIN), ZOOM_MAX);
        if (zoom === previous) return;
        atFit = false;
        const centreX = (pane.scrollLeft + pane.clientWidth / 2) / previous;
        const centreY = (pane.scrollTop + pane.clientHeight / 2) / previous;
        applyZoom();
        pane.scrollLeft = centreX * zoom - pane.clientWidth / 2;
        pane.scrollTop = centreY * zoom - pane.clientHeight / 2;
      }

      function stopSpending() {
        clearInterval(spendingTimer);
        spending = null;
        refresh();
      }

      function setStatus(message, cls = "") {
        el("status").textContent = message;
        el("status").className = cls;
        // The line is truncated, so the untruncated message has to be reachable somewhere.
        el("status").title = message;
      }

      async function save() {
        const page = current();
        const text = el("text").value;
        setStatus("saving…");
        const res = await fetch(`/api/pages/${page.sha256}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text }),
        });
        if (!res.ok) return setStatus("save failed", "error");
        pages[index] = await res.json();
        saved = pages[index].text;
        renderMeta();  // the page just became "edited"
        renderList();
        refresh();
        setStatus("saved");
      }

      async function saveTitle() {
        const title = el("title").value.trim();
        if (title === savedTitle) return;
        const res = await fetch("/api/notebook/title", {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ title }),
        });
        if (!res.ok) {
          el("title").value = savedTitle;
          return setStatus("rename failed", "error");
        }
        applyNotebook(await res.json());
        setStatus("renamed");
      }

      // Gate for anything that spends money. `warnings` are the consequences specific to
      // this page (work about to be destroyed); the cost line is always shown, because the
      // charge is the part being consented to and it must never be the implicit half.
      function confirmSpend({ title, cost, warnings, confirmLabel }) {
        const dialog = el("confirm");
        el("confirm-title").textContent = title;
        el("confirm-ok").textContent = confirmLabel;
        el("confirm-body").replaceChildren(
          ...warnings.map((text) => {
            const line = document.createElement("p");
            line.className = "warn";
            line.textContent = text;
            return line;
          }),
          Object.assign(document.createElement("p"), { className: "cost", textContent: cost })
        );
        dialog.showModal();
        return new Promise((resolve) =>
          // Covers Escape and the backdrop too: both close with an empty returnValue.
          dialog.addEventListener("close", () => resolve(dialog.returnValue === "ok"), {
            once: true,
          })
        );
      }

      async function retranscribe() {
        const page = current();
        const warnings = [];
        if (page.status === "edited") {
          warnings.push("This page has a saved correction. The model's output will replace it.");
        } else if (page.text) {
          warnings.push("This page already has a transcription. It will be replaced.");
        }
        if (isDirty()) warnings.push("Unsaved edits in the editor will be discarded.");

        const ok = await confirmSpend({
          title: `Re-transcribe page ${page.page_number}?`,
          cost: `Sends ${page.filename} to ${model}. This calls the Claude API and bills your key.`,
          warnings,
          confirmLabel: "Re-transcribe",
        });
        if (!ok) return;

        // The reply is applied to the page it was requested for, not to whatever is on
        // screen when it lands: these calls take a while and reviewers keep browsing.
        const requested = index;
        spending = { index: requested, pageNumber: page.page_number, started: performance.now() };
        spendingTimer = setInterval(renderBusy, 1000);
        refresh();
        setStatus("transcribing…");
        let res;
        try {
          res = await fetch(`/api/pages/${page.sha256}/transcribe`, { method: "POST" });
        } catch (error) {
          stopSpending();
          return setStatus("re-transcribe failed: network error", "error");
        }
        stopSpending();
        if (!res.ok) {
          const detail = await res.json().catch(() => null);
          return setStatus(`re-transcribe failed: ${detail?.detail ?? res.status}`, "error");
        }
        pages[requested] = await res.json();
        renderList();
        if (requested !== index) return setStatus(`page ${requested + 1} re-transcribed`);
        saved = pages[index].text;
        el("text").value = saved;
        renderMeta();
        renderPreview();
        refresh();
        setStatus("re-transcribed");
      }

      function drawingsIn(text) {
        return [...text.matchAll(DRAWING_PATTERN)].map((match) => ({
          source: match[0],
          // null for an <svg>; a (possibly empty) string for a "drawing:" comment.
          description: match[1] === undefined ? null : match[1].trim(),
          start: match.index,
          end: match.index + match[0].length,
        }));
      }

      function renderPreview() {
        const drawings = drawingsIn(el("text").value);
        el("toggle-preview").textContent =
          drawings.length ? `Drawings (${drawings.length})` : "Drawings";
        if (!document.body.classList.contains("preview-open")) return;
        if (!drawings.length) {
          const empty = document.createElement("div");
          empty.id = "preview-empty";
          empty.textContent = "No drawings on this page.";
          return el("preview-pane").replaceChildren(empty);
        }
        el("preview-pane").replaceChildren(...drawings.map(drawingCard));
      }

      function drawingCard(drawing, position) {
        const card = document.createElement("figure");
        card.className = "drawing";
        card.title = "Click to select this drawing in the transcription";
        const caption = document.createElement("figcaption");
        caption.textContent = `drawing ${position + 1}`;
        if (drawing.description === null) {
          const image = document.createElement("img");
          // A data-URL <img> renders the SVG without giving model output a foothold in
          // this document: no scripts, no external fetches, no reach into the page.
          const source = encodeURIComponent(withNamespace(drawing.source));
          image.src = `data:image/svg+xml;charset=utf-8,${source}`;
          image.alt = `drawing ${position + 1}`;
          // Malformed SVG must say so rather than leaving a silent blank card.
          image.onerror = () => {
            card.classList.add("broken");
            caption.textContent = `drawing ${position + 1}: malformed SVG, cannot render`;
            image.remove();
          };
          card.append(image);
        } else {
          card.classList.add("broken");
          caption.textContent = drawing.description
            ? `not vectorized: ${drawing.description}`
            : "not vectorized";
        }
        card.append(caption);
        card.onclick = () => revealInText(drawing);
        return card;
      }

      function withNamespace(svg) {
        // Inline in markdown an <svg> needs no xmlns, but as its own document behind a
        // data URL it does, and the model does not always emit one. Without this a
        // perfectly good drawing renders as a broken image.
        return /\sxmlns\s*=/.test(svg)
          ? svg
          : svg.replace(/^<svg\b/i, '<svg xmlns="http://www.w3.org/2000/svg"');
      }

      function revealInText(drawing) {
        const field = el("text");
        field.focus();
        field.setSelectionRange(drawing.start, drawing.end);
        // Selecting does not scroll a textarea, and there is no per-character geometry to
        // measure, so approximate the offset by its share of the text and centre it.
        const share = drawing.start / Math.max(field.value.length, 1);
        field.scrollTop = Math.max(0, share * field.scrollHeight - field.clientHeight / 3);
      }

      function setPaneSize(pane, pixels) {
        const size = Math.min(Math.max(Math.round(pixels), pane.min), pane.max);
        document.documentElement.style.setProperty(pane.css, `${size}px`);
        localStorage.setItem(pane.name, size);
      }

      function setCollapsed(collapsed) {
        document.body.classList.toggle("sidebar-collapsed", collapsed);
        localStorage.setItem("sidebarCollapsed", collapsed ? "1" : "");
      }

      function setPreviewOpen(open) {
        document.body.classList.toggle("preview-open", open);
        localStorage.setItem("previewOpen", open ? "1" : "");
        renderPreview();
      }

      function escapeHtml(value) {
        return value.replace(/[&<>"']/g, (c) =>
          ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]
        );
      }

      el("text").addEventListener("input", () => {
        refresh();
        clearTimeout(previewTimer);
        previewTimer = setTimeout(renderPreview, PREVIEW_DEBOUNCE_MS);
      });
      el("title").addEventListener("blur", saveTitle);
      el("title").addEventListener("keydown", (event) => {
        if (event.key === "Enter") el("title").blur();
        if (event.key === "Escape") {
          el("title").value = savedTitle;
          el("title").blur();
        }
      });
      el("toggle-sidebar").onclick = () =>
        setCollapsed(!document.body.classList.contains("sidebar-collapsed"));
      el("toggle-preview").onclick = () =>
        setPreviewOpen(!document.body.classList.contains("preview-open"));
      el("save").onclick = save;
      el("retranscribe").onclick = retranscribe;
      // Deliberately no keyboard shortcut: a single keystroke should not be able to spend.
      el("confirm-cancel").onclick = () => el("confirm").close("");
      el("confirm-ok").onclick = () => el("confirm").close("ok");
      el("revert").onclick = () => { el("text").value = saved; refresh(); };
      el("prev").onclick = () => select(Math.max(index - 1, 0));
      el("next").onclick = () => select(Math.min(index + 1, pages.length - 1));
      el("zoom-in").onclick = () => zoomBy(ZOOM_STEP);
      el("zoom-out").onclick = () => zoomBy(1 / ZOOM_STEP);
      el("zoom-level").onclick = fitImage;
      // Natural size is unknown until the bytes arrive, so the fit is computed on load.
      el("page-image").onload = fitImage;

      el("image-pane").addEventListener("pointerdown", (event) => {
        // Only from the page itself: a press on the letterboxing around a fitted page is
        // not a grab, and should not toggle the zoom either.
        if (event.button !== 0 || event.target !== el("page-image")) return;
        const pane = el("image-pane");
        event.preventDefault();
        pane.setPointerCapture(event.pointerId);
        panning = {
          x: event.clientX,
          y: event.clientY,
          left: pane.scrollLeft,
          top: pane.scrollTop,
          moved: false,
        };
        pane.classList.add("panning");
      });
      el("image-pane").addEventListener("pointermove", (event) => {
        if (!panning) return;
        const pane = el("image-pane");
        const dx = event.clientX - panning.x;
        const dy = event.clientY - panning.y;
        if (Math.hypot(dx, dy) > PAN_SLOP_PX) panning.moved = true;
        // Inverted: dragging the page right reveals what is off the left edge.
        pane.scrollLeft = panning.left - dx;
        pane.scrollTop = panning.top - dy;
      });
      for (const done of ["pointerup", "pointercancel"]) {
        el("image-pane").addEventListener(done, () => {
          const wasClick = panning && !panning.moved;
          panning = null;
          el("image-pane").classList.remove("panning");
          // A press that never moved keeps the old meaning: toggle between the whole page
          // and full resolution, without having to aim at the toolbar.
          if (wasClick) atFit ? zoomBy(1 / zoom) : fitImage();
        });
      }

      function wireResizer(handle, pane, sizeFromPointer) {
        handle.addEventListener("pointerdown", (event) => {
          // Capture so the drag keeps tracking once the pointer outruns the 5px handle.
          event.preventDefault();
          handle.setPointerCapture(event.pointerId);
          document.body.classList.add("resizing");
        });
        handle.addEventListener("pointermove", (event) => {
          if (!document.body.classList.contains("resizing")) return;
          setPaneSize(pane, sizeFromPointer(event));
        });
        for (const done of ["pointerup", "pointercancel"]) {
          handle.addEventListener(done, () => document.body.classList.remove("resizing"));
        }
        handle.addEventListener("dblclick", () => setPaneSize(pane, pane.value));
      }

      wireResizer(el("sidebar-resizer"), SIDEBAR, (event) =>
        event.clientX - el("sidebar").getBoundingClientRect().left);
      wireResizer(el("preview-resizer"), PREVIEW, (event) =>
        el("text-pane").getBoundingClientRect().bottom - event.clientY);

      document.addEventListener("keydown", (event) => {
        // While the confirmation is up it owns the keyboard: paging or saving underneath
        // it would change what the user is being asked to approve. Escape still closes it,
        // which <dialog> handles natively as a cancel.
        if (el("confirm").open) return;
        if ((event.ctrlKey || event.metaKey) && event.key === "s") {
          event.preventDefault();
          if (!el("save").disabled) save();
          return;
        }
        // Shortcuts must not hijack typing in the transcription or the title.
        const typing = event.target instanceof HTMLElement
          && event.target.matches("input, textarea");
        if (typing || event.ctrlKey || event.metaKey || event.altKey) return;
        if (event.key === "j" || event.key === "ArrowRight") el("next").click();
        if (event.key === "k" || event.key === "ArrowLeft") el("prev").click();
        if (event.key === "[") el("toggle-sidebar").click();
        if (event.key === "p") el("toggle-preview").click();
        // "=" as well as "+": zooming in should not need the shift key.
        if (event.key === "+" || event.key === "=") el("zoom-in").click();
        if (event.key === "-") el("zoom-out").click();
        if (event.key === "0") el("zoom-level").click();
      });

      // The pane resizes from the window, the sidebar drag, and the drawings pane opening.
      // A page still at its fitted size should track all three; a deliberate zoom should
      // survive them, and only have its pannable affordance rechecked.
      new ResizeObserver(() => (atFit ? fitImage() : applyZoom())).observe(el("image-pane"));

      for (const pane of [SIDEBAR, PREVIEW]) {
        setPaneSize(pane, Number(localStorage.getItem(pane.name)) || pane.value);
      }
      setCollapsed(Boolean(localStorage.getItem("sidebarCollapsed")));
      setPreviewOpen(Boolean(localStorage.getItem("previewOpen")));

      window.addEventListener("beforeunload", (event) => {
        if (isDirty()) event.preventDefault();
      });

      load();
    </script>
  </body>
</html>
